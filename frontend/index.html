<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A replay of next-day Nifty 50 volatility forecasts from a Transformer written from scratch in NumPy." />
    <link rel="icon" href="data:," />
    <title>Nifty Volatility Forecaster</title>
    <script>
      // Set before first paint, so a night reader never sees a flash of salmon. useTheme takes over from here.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("nv-theme");
        } catch (error) {}
        var night = stored === "night" || (stored !== "day" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = night ? "night" : "day";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
